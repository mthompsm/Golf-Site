<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1920px;
    background-color: #1a3a2a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 80px;
    font-family: 'Arial', sans-serif;
  }
  .logo {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    color: #c9a84c;
    font-size: 32px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    white-space: nowrap;
  }
  .eyebrow {
    color: #c9a84c;
    font-size: 40px;
    font-style: italic;
    margin-bottom: 30px;
    text-align: center;
    font-family: 'Georgia', serif;
  }
  h1 {
    color: #ffffff;
    font-size: 96px;
    font-weight: 800;
    text-align: center;
    line-height: 1.1;
    margin-bottom: 50px;
  }
  .divider {
    width: 80px;
    height: 3px;
    background: #c9a84c;
    margin: 0 auto 50px auto;
  }
  .what-happens {
    color: rgba(255,255,255,0.6);
    font-size: 40px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    text-align: center;
    margin-bottom: 40px;
  }
  .point {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 32px;
    width: 100%;
  }
  .x {
    color: #e05555;
    font-size: 52px;
    font-weight: 800;
    flex-shrink: 0;
  }
  .point-text {
    color: #ffffff;
    font-size: 46px;
    font-family: 'Georgia', serif;
    line-height: 1.3;
  }
  .truth {
    margin-top: 20px;
    background: rgba(201,168,76,0.15);
    border-left: 6px solid #c9a84c;
    padding: 36px 40px;
    border-radius: 0 8px 8px 0;
  }
  .truth-text {
    color: #c9a84c;
    font-size: 48px;
    font-style: italic;
    font-family: 'Georgia', serif;
    line-height: 1.4;
    text-align: center;
  }
  .cta {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    background: #c9a84c;
    color: #1a3a2a;
    padding: 28px 60px;
    font-size: 36px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-radius: 8px;
    white-space: nowrap;
  }
  .website {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-size: 28px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="logo">⛳ STOP OVERTHINKING GOLF</div>
  <div class="eyebrow">The hard truth:</div>
  <h1>Swinging harder is ruining your game.</h1>
  <div class="divider"></div>
  <div class="what-happens">What actually happens:</div>
  <div class="point"><span class="x">✗</span><span class="point-text">Your backswing shortens</span></div>
  <div class="point"><span class="x">✗</span><span class="point-text">Your turn disappears</span></div>
  <div class="point"><span class="x">✗</span><span class="point-text">Your arms take over</span></div>
  <div class="point"><span class="x">✗</span><span class="point-text">The ball goes sideways</span></div>
  <div class="truth">
    <div class="truth-text">Power comes from the release.<br>Not the effort.</div>
  </div>
  <div class="cta">Lesson 6 — Link in Bio</div>
  <div class="website">stopoverthinkinggolf.com</div>
</body>
</html>
