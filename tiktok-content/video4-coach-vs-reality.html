<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1920px;
    background-color: #1a3a2a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 80px;
    font-family: 'Arial', sans-serif;
  }
  .logo {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    color: #c9a84c;
    font-size: 32px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    white-space: nowrap;
  }
  h1 {
    color: #ffffff;
    font-size: 72px;
    font-weight: 700;
    text-align: center;
    line-height: 1.2;
    margin-bottom: 60px;
  }
  .divider {
    width: 80px;
    height: 3px;
    background: #c9a84c;
    margin: 0 auto 60px auto;
  }
  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    width: 100%;
    margin-bottom: 40px;
  }
  .col-header {
    font-size: 40px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    text-align: center;
    padding: 24px;
    border-radius: 8px;
    margin-bottom: 30px;
  }
  .col-header.red { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.5); }
  .col-header.gold { background: #c9a84c; color: #1a3a2a; }
  .col-item {
    font-size: 40px;
    color: #ffffff;
    text-align: center;
    padding: 18px 10px;
    line-height: 1.3;
    font-family: 'Georgia', serif;
  }
  .col-item.faded { color: rgba(255,255,255,0.45); text-decoration: line-through; font-size: 36px; }
  .col-item.gold { color: #c9a84c; font-style: italic; }
  .cta {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    background: #c9a84c;
    color: #1a3a2a;
    padding: 28px 60px;
    font-size: 36px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-radius: 8px;
    white-space: nowrap;
  }
  .website {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-size: 28px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="logo">⛳ STOP OVERTHINKING GOLF</div>
  <h1>What your coach gives you vs. what you actually need</h1>
  <div class="divider"></div>
  <div class="columns">
    <div>
      <div class="col-header red">The Coach</div>
      <div class="col-item faded">One tip per session</div>
      <div class="col-item faded">"See you next week"</div>
      <div class="col-item faded">Fix the symptom</div>
      <div class="col-item faded">$150/hour</div>
    </div>
    <div>
      <div class="col-header gold">What Works</div>
      <div class="col-item gold">The complete system</div>
      <div class="col-item gold">Grip → Setup → Turn</div>
      <div class="col-item gold">Fix the cause</div>
      <div class="col-item gold">One time. Done.</div>
    </div>
  </div>
  <div class="cta">7-Lesson System — Link in Bio</div>
  <div class="website">stopoverthinkinggolf.com</div>
</body>
</html>
