<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1920px;
    background-color: #1a3a2a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 80px;
    font-family: 'Arial', sans-serif;
  }
  .logo {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    color: #c9a84c;
    font-size: 32px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    white-space: nowrap;
  }
  h1 {
    color: #ffffff;
    font-size: 86px;
    font-weight: 800;
    text-align: center;
    line-height: 1.15;
    margin-bottom: 50px;
    font-style: italic;
  }
  .divider {
    width: 80px;
    height: 3px;
    background: #c9a84c;
    margin: 0 auto 50px auto;
  }
  .item {
    display: flex;
    align-items: center;
    gap: 28px;
    margin-bottom: 30px;
    width: 100%;
  }
  .check {
    font-size: 52px;
    flex-shrink: 0;
  }
  .check.no { color: #e05555; }
  .check.yes { color: #5cb85c; }
  .item-text {
    font-size: 48px;
    font-family: 'Georgia', serif;
    line-height: 1.3;
  }
  .item-text.faded { color: rgba(255,255,255,0.45); }
  .item-text.white { color: #ffffff; }
  .item-text.gold { color: #c9a84c; font-style: italic; }
  .then {
    color: #c9a84c;
    font-size: 44px;
    font-style: italic;
    text-align: center;
    margin: 30px 0;
    font-family: 'Georgia', serif;
  }
  .result {
    background: rgba(201,168,76,0.15);
    border: 2px solid #c9a84c;
    border-radius: 12px;
    padding: 40px;
    text-align: center;
    margin-top: 10px;
  }
  .result-text {
    color: #c9a84c;
    font-size: 52px;
    font-weight: 800;
    line-height: 1.3;
  }
  .cta {
    position: absolute;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    background: #c9a84c;
    color: #1a3a2a;
    padding: 28px 60px;
    font-size: 36px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    border-radius: 8px;
    white-space: nowrap;
  }
  .website {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-size: 28px;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="logo">⛳ STOP OVERTHINKING GOLF</div>
  <h1>Every golfer at some point:</h1>
  <div class="divider"></div>
  <div class="item"><span class="check no">✗</span><span class="item-text faded">Buys new clubs</span></div>
  <div class="item"><span class="check no">✗</span><span class="item-text faded">Takes lessons</span></div>
  <div class="item"><span class="check no">✗</span><span class="item-text faded">Watches 47 YouTube videos</span></div>
  <div class="item"><span class="check no">✗</span><span class="item-text faded">Still shoots 95</span></div>
  <div class="then">Then:</div>
  <div class="item"><span class="check yes">✓</span><span class="item-text white">Learns 7 fundamentals in order</span></div>
  <div class="item"><span class="check yes">✓</span><span class="item-text white">Actually practices them</span></div>
  <div class="result">
    <div class="result-text">Breaks 85 for<br>the first time.</div>
  </div>
  <div class="cta">The 7 Fundamentals — Link in Bio</div>
  <div class="website">stopoverthinkinggolf.com</div>
</body>
</html>
